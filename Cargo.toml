[package]
name = "simple_lcd"
version = "0.1.0"
edition = "2021"

[dependencies]
embedded-graphics = "0.7.1"
embedded-graphics-core = "0.3.3"
embedded-hal = "0.2"
fugit = "0.3"
panic-halt = "0.2"
display-interface-spi = "0.4"
st7789 = "0.6"
cortex-m = "0.7"
cortex-m-rt = "0.7"
critical-section = "1.2"
rp2040-hal = { version = "0.9.2", features = ["critical-section-impl"] }
rp2040-boot2 = "0.2"  # or the latest version available