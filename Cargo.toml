[package]
name = "lilbud"
version = "0.1.0"
edition = "2021"

[features]
default = ["desktop"]
desktop  = ["dep:sdl2", "dep:serde_json", "dep:rand"]
wasm     = ["dep:wasm-bindgen", "dep:web-sys", "dep:js-sys", "dep:serde_json", "dep:rand", "dep:getrandom"]
embedded = ["dep:cortex-m", "dep:cortex-m-rt", "dep:panic-halt", "dep:rp2040-hal", "dep:rp2040-boot2", "dep:embedded-hal", "dep:embedded-hal-1", "dep:portable-atomic", "dep:serde-json-core"]

[dependencies]
embedded-graphics = "0.8"
heapless = { version = "0.8", features = ["serde"] }
serde = { version = "1.0", features = ["derive"], default-features = false }

# Desktop only
sdl2 = { version = "0.35", optional = true }
serde_json = { version = "1.0", optional = true }
rand = { version = "0.8", optional = true }

# WASM only
wasm-bindgen = { version = "=0.2.92", optional = true }
web-sys = { version = "=0.3.69", optional = true, features = [
    "Window", "Document", "HtmlCanvasElement",
    "CanvasRenderingContext2d", "ImageData",
] }
js-sys = { version = "=0.3.69", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }

# Embedded only
cortex-m = { version = "0.7", features = ["critical-section-single-core"], optional = true }
cortex-m-rt = { version = "0.7", optional = true }
panic-halt = { version = "0.2", optional = true }
rp2040-hal = { version = "0.10", features = ["rt"], optional = true }
rp2040-boot2 = { version = "0.3", optional = true }
embedded-hal = { version = "0.2", optional = true }
embedded-hal-1 = { package = "embedded-hal", version = "1.0", optional = true }
portable-atomic = { version = "1", features = ["critical-section"], optional = true }
serde-json-core = { version = "0.5", features = ["heapless"], optional = true }
