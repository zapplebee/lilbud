name: dist

on:
  workflow_dispatch:

jobs:
  # ── macOS (Apple Silicon) ────────────────────────────────────────────────────
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: macos-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version "=0.2.92" --locked

      - name: Build WASM
        run: cargo build --release --target wasm32-unknown-unknown --no-default-features --features wasm

      - name: Generate JS bindings
        run: wasm-bindgen target/wasm32-unknown-unknown/release/lilbud.wasm --out-dir pkg --target web

      - name: Build macOS binary
        run: cargo build --release --target aarch64-apple-darwin --no-default-features --features webview

      - name: Assemble .app bundle
        run: |
          mkdir -p lilbud.app/Contents/MacOS
          cp target/aarch64-apple-darwin/release/lilbud lilbud.app/Contents/MacOS/lilbud
          cp Info.plist lilbud.app/Contents/Info.plist
          zip -r lilbud-mac.zip lilbud.app

      - uses: actions/upload-artifact@v4
        with:
          name: lilbud-mac
          path: lilbud-mac.zip

