<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lilbud</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f172a; color: #e2e8f0; font-family: monospace; min-height: 100vh; display: flex; justify-content: center; padding: 2.5rem 1.5rem 4rem; }
    #empty-room { display: flex; align-items: center; justify-content: center; color: #4a6a8a; font-size: 1.2rem; width: 100%; }
    #dock-view { display: flex; flex-direction: column; align-items: center; gap: 2rem; width: 100%; max-width: 360px; }

    #face-canvas { display: block; width: 240px; height: 240px; image-rendering: pixelated; border-radius: 50%; }

    /* identity */
    #id-card { text-align: center; width: 100%; }
    #id-name { font-size: 1.4rem; margin-bottom: 0.5rem; min-height: 1.5rem; }
    #id-bio { color: #94a3b8; white-space: pre-wrap; line-height: 1.5; }
    #btn-edit-id { background: none; border: none; color: #4a6a8a; font-size: 0.85rem; cursor: pointer; margin-top: 0.75rem; font-family: monospace; padding: 0.4rem 0.8rem; }
    #btn-edit-id:hover { color: #94a3b8; }

    #edit-id-panel { display: flex; flex-direction: column; gap: 0.6rem; width: 100%; }

    /* action buttons */
    #action-buttons { display: flex; gap: 1rem; }

    /* your status */
    #my-status { width: 100%; display: flex; flex-direction: column; gap: 0.6rem; }
    #my-status-label { font-size: 0.7rem; color: #4a6a8a; text-transform: uppercase; letter-spacing: 0.1em; }
    #my-status-display { color: #e2e8f0; white-space: pre-wrap; cursor: pointer; min-height: 1.5rem; line-height: 1.5; padding: 0.5rem 0; }
    #my-status-display:hover { color: #60a5fa; }
    #my-status-edit { display: flex; flex-direction: column; gap: 0.6rem; }

    /* collected statuses */
    #collected { width: 100%; display: flex; flex-direction: column; gap: 0.75rem; }
    #collected-label { font-size: 0.7rem; color: #4a6a8a; text-transform: uppercase; letter-spacing: 0.1em; }
    #collected-list { display: flex; flex-direction: column; gap: 0.25rem; }
    .status-entry { display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0; border-bottom: 1px solid #1e293b; }
    .status-name { color: #60a5fa; flex-shrink: 0; }
    .status-text { color: #94a3b8; white-space: pre-wrap; flex: 1; line-height: 1.4; }
    .status-dismiss { background: none; border: none; color: #334155; cursor: pointer; font-size: 1.2rem; line-height: 1; padding: 0.4rem 0.5rem; flex-shrink: 0; margin: -0.4rem -0.5rem -0.4rem 0; }
    .status-dismiss:hover { color: #f87171; }

    /* shared controls */
    input, textarea { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; padding: 0.6rem; font-family: monospace; font-size: 1rem; width: 100%; resize: vertical; line-height: 1.4; }
    button { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; padding: 0.7rem 1.4rem; cursor: pointer; font-family: monospace; font-size: 1rem; }
    button:hover { background: #334155; }
    .btn-row { display: flex; gap: 0.6rem; }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="empty-room">lilbud is not here</div>

  <div id="dock-view" hidden>
    <canvas id="face-canvas" width="240" height="240"></canvas>

    <div id="id-card">
      <div id="id-name"></div>
      <div id="id-bio"></div>
      <button id="btn-edit-id">edit</button>
    </div>

    <div id="edit-id-panel" hidden>
      <input id="edit-name" type="text" placeholder="name" />
      <textarea id="edit-bio" rows="2" placeholder="bio"></textarea>
      <div class="btn-row">
        <button id="btn-save-id">save</button>
        <button id="btn-cancel-id">cancel</button>
      </div>
    </div>

    <div id="action-buttons">
      <button id="btn-feed">feed</button>
      <button id="btn-play">play</button>
      <button id="btn-sleep">sleep</button>
    </div>

    <div id="my-status">
      <div id="my-status-label">your status</div>
      <div id="my-status-display"></div>
      <div id="my-status-edit" hidden>
        <textarea id="status-input" rows="2" placeholder="what's your status?"></textarea>
        <div class="btn-row">
          <button id="btn-save-status">save</button>
          <button id="btn-cancel-status">cancel</button>
        </div>
      </div>
    </div>

    <div id="collected">
      <div id="collected-label">collected</div>
      <div id="collected-list"></div>
    </div>
  </div>

  <script type="module" src="/dist/app.js"></script>
</body>
</html>
